services:
  - type: web
    name: freedom-park-booking
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && flask --app run:app db upgrade && python scripts/prepare_render.py
    startCommand: sh -c 'python -m flask --app run:app db upgrade && exec gunicorn wsgi:app'
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: OTP_MOCK_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
