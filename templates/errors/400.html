{% extends 'base.html' %}

{% block title %}400 — Bad Request | Freedom Park{% endblock %}

{% block content %}
<div class="container section" style="max-width: 540px; text-align: center;">
  <div class="card" style="padding: var(--space-3xl) var(--space-xl);">
    <div style="font-size: 3.5rem; color: var(--color-warning); margin-bottom: 1rem;">⚠️</div>
    <h1>Bad Request</h1>
    <p style="color: var(--color-text-muted); margin-bottom: 1.5rem;">
      The request could not be processed due to invalid parameters or an expired form session.
    </p>
    <a href="{{ url_for('public.index') }}" class="btn btn-primary">&larr; Return to Homepage</a>
  </div>
</div>
{% endblock %}
