<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Freedom Park — Private Family Resort | Pernambut, India{% endblock %}</title>
  <meta name="description" content="{% block description %}Freedom Park is an exclusive private family resort in Pernambut, India. The entire park is reserved for one family per day. Up to 100 guests, 8 AM - 8 PM.{% endblock %}">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/hero_v4.css') }}">

  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include 'components/splash.html' %}
  {% include 'components/navbar.html' %}
  {% include 'components/flashes.html' %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include 'components/footer.html' %}

  <!-- Core JavaScript -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/splash.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
