{% extends 'base.html' %}

{% block title %}Staff Login — Freedom Park Pernambut{% endblock %}

{% block content %}
<div class="container section" style="max-width: 460px;">
  <div class="card" style="box-shadow: var(--shadow-md);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span class="section-tag" style="margin-bottom: 0.5rem;">Authorized Staff Only</span>
      <h2 style="margin-bottom: 0.25rem;">Staff Sign In</h2>
      <p style="color: var(--color-text-muted); font-size: 0.9rem;">
        Sign in to access your administrative, partner, or security dashboard.
      </p>
    </div>

    <form method="POST" action="{{ url_for('auth.staff_login', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-control" required autofocus placeholder="Enter staff username">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer;">
          <input type="checkbox" name="remember" value="1">
          <span>Remember me</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In to Staff Portal</button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--color-border); font-size: 0.88rem; color: var(--color-text-muted);">
      Are you a guest or customer? <br>
      <a href="{{ url_for('auth.customer_login') }}" style="font-weight: 600; color: var(--color-primary);">Sign In with Mobile OTP &rarr;</a>
    </div>
  </div>
</div>
{% endblock %}
