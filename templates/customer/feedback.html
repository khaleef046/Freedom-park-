{% extends 'base.html' %}

{% block title %}Share Feedback — Freedom Park{% endblock %}

{% block content %}
<div class="container section" style="max-width: 580px;">
  <div class="card" style="box-shadow: var(--shadow-md);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span class="section-tag" style="margin-bottom: 0.5rem;">Guest Feedback</span>
      <h2>How Was Your Visit?</h2>
      <p style="color: var(--color-text-muted); font-size: 0.9rem;">
        Booking: <strong>{{ booking.booking_uid }}</strong> on {{ format_date_long(booking.booking_date) }}
      </p>
    </div>

    <form method="POST" action="{{ url_for('customer.submit_feedback', booking_uid=booking.booking_uid) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="rating" class="form-label">Overall Rating (1 to 5 Stars)</label>
        <select id="rating" name="rating" class="form-select" required>
          <option value="5" selected>⭐⭐⭐⭐⭐ 5 Stars — Outstanding Experience</option>
          <option value="4">⭐⭐⭐⭐ 4 Stars — Very Good</option>
          <option value="3">⭐⭐⭐ 3 Stars — Average / Satisfactory</option>
          <option value="2">⭐⭐ 2 Stars — Needs Improvement</option>
          <option value="1">⭐ 1 Star — Unsatisfactory</option>
        </select>
      </div>

      <div class="form-group">
        <label for="category" class="form-label">Feedback Category</label>
        <select id="category" name="category" class="form-select">
          <option value="Positive Feedback">Positive Feedback</option>
          <option value="Suggestion">Suggestion / Idea</option>
          <option value="Improvement">Area for Improvement</option>
          <option value="Facility Issue">Facility / Amenities</option>
          <option value="Equipment Issue">Sports Equipment</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message" class="form-label">Your Message</label>
        <textarea id="message" name="message" class="form-control" rows="4" required placeholder="Tell us about your family's experience at Freedom Park..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Submit Feedback &rarr;</button>
    </form>
  </div>
</div>
{% endblock %}
